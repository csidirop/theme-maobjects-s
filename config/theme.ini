[info]
name = "MAObjects S"
version = "0.0.1"
author = "UB-Mannheim"
;description = ""
theme_link = "https://github.com/UB-Mannheim/theme-maobjects-s"
author_link = "https:bib.uni-mannheim.de"
omeka_version_constraint = "^4.0.0"
has_translations = "true"
helpers[] = "FooterLinks"
helpers[] = "HeaderBanner"
helpers[] = "BrowseLayout"
helpers[] = "MetadataFormats"

[config]
element_groups.header = "Header"
element_groups.footer_branding = "Footer: Branding"
element_groups.footer_links = "Footer: Link columns"
element_groups.footer_legal = "Footer: Legal and social links"
element_groups.resources = "Browse and resource pages"

elements.logo.name = "logo"
elements.logo.options.element_group = "header"
elements.logo.type = "Omeka\Form\Element\Asset"
elements.logo.options.label = "Logo"

elements.logo_text.name = "logo_text"
elements.logo_text.type = "Text"
elements.logo_text.options.element_group = "header"
elements.logo_text.options.label = "Header subtitle"
elements.logo_text.options.info = "Optional plain text below or beside the logo or site title."

elements.logo_text_position.name = "logo_text_position"
elements.logo_text_position.type = "Laminas\Form\Element\Select"
elements.logo_text_position.options.element_group = "header"
elements.logo_text_position.options.label = "Header subtitle position"
elements.logo_text_position.options.value_options.below = "Below"
elements.logo_text_position.options.value_options.beside = "Beside"
elements.logo_text_position.attributes.value = "below"

elements.header_search_mode.name = "header_search_mode"
elements.header_search_mode.type = "Laminas\Form\Element\Select"
elements.header_search_mode.options.element_group = "header"
elements.header_search_mode.options.label = "Header search"
elements.header_search_mode.options.info = "The toggle uses the site's Omeka S search form. The advanced search link opens item search."
elements.header_search_mode.options.value_options.toggle = "Search toggle"
elements.header_search_mode.options.value_options.link = "Advanced search link"
elements.header_search_mode.options.value_options.hidden = "Hidden"
elements.header_search_mode.attributes.value = "toggle"

elements.banner.name = "banner"
elements.banner.options.element_group = "header"
elements.banner.type = "Omeka\Form\Element\Asset"
elements.banner.options.label = "Banner"
elements.banner.options.info = "A large image at the top of the page"

elements.banner_height.name = "banner_height"
elements.banner_height.options.element_group = "header"
elements.banner_height.type = "Text"
elements.banner_height.options.label = "Banner height"
elements.banner_height.options.info = "Banner height, for example 300px or 15rem. Supported units: px, em, rem, vh, vw, vmin, vmax, %. Leave empty or use auto for the natural image height."

elements.banner_height_mobile.name = "banner_height_mobile"
elements.banner_height_mobile.options.element_group = "header"
elements.banner_height_mobile.type = "Text"
elements.banner_height_mobile.options.label = "Banner height for mobile devices"
elements.banner_height_mobile.options.info = "Banner height at widths up to 640px, using the same units as Banner height. Leave empty to keep the desktop height; use auto for the natural image height."

elements.banner_alt.name = "banner_alt"
elements.banner_alt.type = "Text"
elements.banner_alt.options.element_group = "header"
elements.banner_alt.options.label = "Banner alternative text"
elements.banner_alt.options.info = "Describe meaningful image content. Leave empty for a decorative banner."

elements.banner_visibility.name = "banner_visibility"
elements.banner_visibility.type = "Laminas\Form\Element\Select"
elements.banner_visibility.options.element_group = "header"
elements.banner_visibility.options.label = "Banner visibility"
elements.banner_visibility.options.value_options.all = "All pages"
elements.banner_visibility.options.value_options.home = "Homepage only"
elements.banner_visibility.options.value_options.inner = "All except homepage"
elements.banner_visibility.options.value_options.none = "Hidden"
elements.banner_visibility.attributes.value = "all"

elements.banner_position.name = "banner_position"
elements.banner_position.options.element_group = "header"
elements.banner_position.type = "Laminas\Form\Element\Select"
elements.banner_position.options.label = "Banner position"
elements.banner_position.options.info = "Where to affix banner image when scaling down using a fixed height."
elements.banner_position.options.value_options.center = "Fix to center"
elements.banner_position.options.value_options.flex_start = "Fix to top"
elements.banner_position.options.value_options.flex_end = "Fix to bottom"

elements.nav_depth.name = "nav_depth"
elements.nav_depth.options.element_group = "header"
elements.nav_depth.attributes.id = "nav_depth"
elements.nav_depth.type = "Number"
elements.nav_depth.options.label = "Top Navigation Depth"
elements.nav_depth.options.info = "Maximum number of levels to show in the site's top navigation bar. Set to 0 to show all levels."
elements.nav_depth.attributes.min = 0
elements.nav_depth.attributes.value = 0

elements.footer.name = "footer"
elements.footer.options.element_group = "footer_links"
elements.footer.attributes.id = "footer"
elements.footer.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer.options.label = "Footer Content"
elements.footer.options.info = "Optional HTML content below the footer columns. Existing saved content is now displayed."
elements.footer.attributes.value = "Powered by Omeka S"

elements.browse_layout.name = "browse_layout"
elements.browse_layout.options.element_group = "resources"
elements.browse_layout.attributes.id = "browse_layout"
elements.browse_layout.type = "Laminas\Form\Element\Select"
elements.browse_layout.options.label = "Layout for Browse Pages"
elements.browse_layout.options.value_options.grid = "Grid"
elements.browse_layout.options.value_options.list = "List"
elements.browse_layout.options.value_options.togglegrid = "Toggle (default: grid)"
elements.browse_layout.options.value_options.togglelist = "Toggle (default: list)"

elements.metadata_output_links.name = "metadata_output_links"
elements.metadata_output_links.type = "Laminas\Form\Element\Checkbox"
elements.metadata_output_links.options.element_group = "resources"
elements.metadata_output_links.options.label = "Show metadata output links"
elements.metadata_output_links.options.info = "Link to native API formats on resource and browse pages. Browse output contains only the displayed page. Disable if another module supplies output controls. Omeka S 4.0 supports JSON-LD; 4.1+ also supports RDF/XML, Turtle, N3, and N-Triples."
elements.metadata_output_links.attributes.value = "1"

elements.media_caption.name = "media_caption"
elements.media_caption.options.element_group = "resources"
elements.media_caption.attributes.id = "media_caption"
elements.media_caption.type = "Laminas\Form\Element\Select"
elements.media_caption.options.label = "Media Caption in Viewer"
elements.media_caption.options.description = "Set caption content for when a media is viewed in fullscreen"
elements.media_caption.options.value_options.none = "None"
elements.media_caption.options.value_options.title= "Dublin Core Title"
elements.media_caption.options.value_options.description = "Dublin Core Description"

elements.boolean_value_display.name = "boolean_value_display"
elements.boolean_value_display.options.element_group = "resources"
elements.boolean_value_display.attributes.id = "boolean_value_display"
elements.boolean_value_display.attributes.value = "true_false"
elements.boolean_value_display.type = "Laminas\Form\Element\Select"
elements.boolean_value_display.options.label = "Boolean Value Display"
elements.boolean_value_display.options.info = "Choose how Boolean metadata values are displayed on resource pages."
elements.boolean_value_display.options.value_options.true_false = "True / False"
elements.boolean_value_display.options.value_options.yes_no = "Yes / No"
elements.boolean_value_display.options.value_options.icons = "Checkmark / X icons"

